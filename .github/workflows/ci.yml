name: CI

# Pull requests run one fast path: fork boundary, then a quality job (format, lint,
# typecheck, architecture, secrets) and an engine compile job ("Engine tests" keeps
# its check name but runs no tests) in parallel.
# A PR whose diff is docs-only or only bumps version strings skips both heavy jobs;
# a skipped job still satisfies a required check.
#
# The slower checks (package integrity, repository hygiene, Storybook, native-test
# contracts) run only when this workflow is dispatched by hand.

on:
  pull_request:
    branches: [main, develop, master]
    paths-ignore:
      - 'packages/docs/**'
      - 'openspec/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    timeout-minutes: 2
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base=$(git merge-base "$BASE_SHA" HEAD)
          mapfile -t files < <(git diff --name-only "$base" HEAD)
          heavy=false
          for f in "${files[@]}"; do
            case "$f" in
              *.md|docs/*|LICENSE*|CHANGELOG*) continue ;;
              VERSION|REDROB_VERSION|*-version.txt) continue ;;
              package.json|*/package.json|bun.lock|Cargo.toml|*/Cargo.toml|Cargo.lock|*/Cargo.lock|*/tauri.conf.json)
                # Version-only: every changed line is a "version": / version = line.
                if git diff -U0 "$base" HEAD -- "$f" \
                  | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' \
                  | grep -qvE '^[-+][[:space:]]*("version":[[:space:]]*"[^"]*",?|version[[:space:]]*=[[:space:]]*"[^"]*")[[:space:]]*$'; then
                  heavy=true; break
                fi
                continue ;;
              *) heavy=true; break ;;
            esac
          done
          echo "changed files: ${#files[@]}, heavy=$heavy"
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  fork-boundary:
    name: Fork boundary
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Reads upstream-base.json, LICENSE and NOTICE only, so it needs no install and
      # no Bun. Kept in its own job so a deleted upstream copyright line fails fast.
      - name: Verify upstream attribution and pin
        run: node scripts/check-upstream-boundary.mjs

  source-quality:
    name: Code quality
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Generate package declarations
        run: bun run build:packages

      - name: Verify formatting
        run: bun run format:check

      - name: Lint TypeScript and Vue
        run: bun run lint

      - name: Typecheck application and SDKs
        run: bun run typecheck

      - name: Enforce architecture and type-shape boundaries
        run: bun run check:arch && bun run test:type-shapes

      - name: Scan for committed secrets
        run: bun run check:secrets

  unit-tests:
    name: Engine tests
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      # Compile only: tests are not run on pull requests (run them locally);
      # the release build compiles everything again.
      - name: Compile engine (Core)
        run: bun --filter @redrob-design/core build

  # ---- Dispatch-only: not run on pull requests --------------------------------

  package-quality:
    name: Package integrity
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Build publishable packages
        run: bun run build:packages

      - name: Validate package exports
        run: bun run check:packages

      - name: Detect unused dependencies and files
        run: bun run check:deps

      - name: Validate workspace dependency policy
        run: bun run check:monorepo

  repository-quality:
    name: Repository hygiene
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Validate translations
        run: bun run check:i18n

      - name: Validate documentation links and structure
        run: bun run check:docs

      - name: Audit critical dependency vulnerabilities
        run: bun run check:audit

      - name: Test repository tooling
        run: bun run test:tools

      - name: Detect duplicated product code
        run: bun run test:dupes

  storybook:
    name: Component workshop
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Build component dependencies
        run: bun run build:packages

      - name: Build static Storybook
        run: bun run build-storybook

  native-test-contracts:
    name: Native app contracts
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 8
    runs-on: ubuntu-24.04
    container:
      # Published by .github/workflows/native-contracts-image.yml into a package owned by
      # THIS repository (ghcr.io/<owner>/<repo>/...), not by the organisation namespace,
      # so access follows the repository through renames.
      image: ghcr.io/${{ github.repository }}/native-contracts-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: native-test

      - uses: ./.github/actions/setup-bun

      - name: Typecheck native interaction tests
        run: bun run check:native-test

      - name: Compile native-test Tauri feature
        run: cargo check --manifest-path desktop/Cargo.toml --features native-test
