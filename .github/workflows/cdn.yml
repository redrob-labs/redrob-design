# Publish the Redrob Design desktop downloads to https://cdn.redrob.ai/design/.
#
# This is not a product release: no npm, no GitHub Release, no store listing,
# just the files the Console product page links. Pushing this file is how the
# workflow runs, which is also how a publish is requested.
#
# All jobs publish from the same commit and the same version, so design/latest/
# holds one application rather than platform builds from different trees. The
# published keys are:
#
#   design/<version>/redrob-design-x64-<version>-setup.exe   signed, by version
#   design/<version>/redrob-design-{aarch64,x64}-<version>.dmg signed and notarized
#   design/latest/redrob-design-x64-setup.exe                the link that never moves
#   design/latest/redrob-design-{aarch64,x64}.dmg
#   design/latest/redrob-design-x64.{AppImage,deb,rpm}
#
# Windows NSIS is signed with the organization Authenticode certificate
# (WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD, read by Tauri as WINDOWS_CERTIFICATE).
# The Linux bundles are UNSIGNED: an ubuntu runner has no Linux signing
# identity, and the download page must not imply otherwise.
#
# The upload is gated on the bucket and credentials being present, so an
# unprovisioned CDN cannot redden this build. The credentials carry
# s3:PutObject only, so a published key is verified with an HTTP GET through
# CloudFront and a checksum comparison, never with a listing or a read.
name: cdn

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cdn.yml'
      - '.github/scripts/cdn-publish.sh'

permissions:
  contents: read

jobs:
  windows:
    if: github.repository == 'redrob-labs/redrob-design'
    runs-on: windows-latest
    env:
      # Organization secrets shared with every desktop app that ships a Windows
      # installer. A repository secret of the same name would override them.
      WINDOWS_CERTIFICATE: ${{ secrets.WIN_CSC_LINK }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Require the Windows signing certificate
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { throw "Missing WIN_CSC_LINK organization secret" }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "Missing WIN_CSC_KEY_PASSWORD organization secret" }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: cdn-x86_64-pc-windows-msvc
          cache-on-failure: true

      - uses: ./.github/actions/setup-bun

      - name: Read the application version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./desktop/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      # `tauri build` signs from the Windows certificate store by thumbprint. The
      # WINDOWS_CERTIFICATE pair is only read by tauri-action, which this job does
      # not use, so the PFX is imported here and its thumbprint is handed to the
      # bundler as a config overlay. An overlay file rather than an edit to
      # tauri.conf.json, because a thumbprint is specific to this runner's store.
      - name: Import the signing certificate
        id: certificate
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "redrob-code-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          if (-not $imported.Thumbprint) { throw "The certificate imported without a thumbprint" }
          Write-Host "Imported $($imported.Subject)"
          $overlay = Join-Path $env:RUNNER_TEMP "tauri.sign.conf.json"
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $imported.Thumbprint
                digestAlgorithm       = "sha256"
                timestampUrl          = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Path $overlay -Encoding utf8
          "overlay=$overlay" >> $env:GITHUB_OUTPUT

      - name: Build the signed Windows installer
        run: bunx @tauri-apps/cli build --target x86_64-pc-windows-msvc --bundles nsis --config "${{ steps.certificate.outputs.overlay }}"

      - name: Verify the Authenticode signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Recurse -Filter "*-setup.exe" -Path "desktop/target/x86_64-pc-windows-msvc/release/bundle" | Select-Object -First 1
          if (-not $installer) { throw "The NSIS installer was not produced" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if (-not $signature.SignerCertificate) {
            throw "The installer has no Authenticode signer certificate"
          }
          # A self-signed certificate is not trusted on the runner, so Status is
          # UnknownError or NotTrusted rather than Valid. Reject only an unsigned
          # file or a broken hash.
          $accepted = @("Valid", "UnknownError", "NotTrusted")
          if ($accepted -notcontains $signature.Status.ToString()) {
            throw "Invalid Authenticode signature: $($signature.Status) ($($signature.StatusMessage))"
          }
          Write-Host "Signed by: $($signature.SignerCertificate.Subject) status=$($signature.Status)"
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item $installer.FullName "staging/redrob-design-x64-$($env:APP_VERSION)-setup.exe"
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows
          path: staging/redrob-design-x64-*-setup.exe
          if-no-files-found: error
          retention-days: 3

  # Publish from Ubuntu so the uploader sees a 403 as "not yet there" the same
  # way the Linux job does, and so a failed upload can be retried without a
  # 20-minute Windows rebuild.
  publish-windows:
    needs: windows
    if: github.repository == 'redrob-labs/redrob-design'
    runs-on: ubuntu-latest
    env:
      REDROB_CDN_BUCKET: ${{ vars.REDROB_CDN_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      CDN_PUBLIC_HOST: cdn.redrob.ai
      CDN_PREFIX: design
      APP_VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: signed-windows
          path: staging

      - name: Publish to cdn.redrob.ai
        run: bash .github/scripts/cdn-publish.sh staging


  macos:
    if: github.repository == 'redrob-labs/redrob-design'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - platform: macos-14
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.platform }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Require Apple signing and notarization secrets
        shell: bash
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_API_KEY_P8_BASE64 \
            APPLE_API_KEY \
            APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing macOS signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | openssl base64 -d -A > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: cdn-${{ matrix.target }}
          cache-on-failure: true

      - uses: ./.github/actions/setup-bun

      - name: Read the application version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./desktop/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build the signed and notarized macOS DMG
        run: bunx @tauri-apps/cli build --target ${{ matrix.target }} --bundles dmg

      - name: Verify signing and notarization, then stage the DMG
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle="desktop/target/$TARGET/release/bundle"
          app="$(find "$bundle/macos" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          dmg="$(find "$bundle/dmg" -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          test -n "$app" || { echo 'The macOS app bundle was not produced' >&2; exit 1; }
          test -n "$dmg" || { echo 'The macOS DMG was not produced' >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$dmg"
          mkdir -p staging
          cp "$dmg" "staging/redrob-design-$APP_ARCH-$APP_VERSION.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: signed-macos-${{ matrix.arch }}
          path: staging/redrob-design-*.dmg
          if-no-files-found: error
          retention-days: 3

  # Both architecture builds must be signed and notarized before either macOS
  # alias moves, so latest/ cannot expose an incomplete macOS release.
  publish-macos:
    needs: macos
    if: github.repository == 'redrob-labs/redrob-design'
    runs-on: ubuntu-latest
    env:
      REDROB_CDN_BUCKET: ${{ vars.REDROB_CDN_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      CDN_PUBLIC_HOST: cdn.redrob.ai
      CDN_PREFIX: design

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: signed-macos-*
          path: staging
          merge-multiple: true

      - name: Read the application version
        id: version
        run: echo "version=$(node -p "require('./desktop/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish to cdn.redrob.ai
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/cdn-publish.sh staging

  linux:
    if: github.repository == 'redrob-labs/redrob-design'
    runs-on: ubuntu-22.04
    env:
      REDROB_CDN_BUCKET: ${{ vars.REDROB_CDN_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      CDN_PUBLIC_HOST: cdn.redrob.ai
      CDN_PREFIX: design

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: cdn-x86_64-unknown-linux-gnu
          cache-on-failure: true

      - name: Install the Linux bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: ./.github/actions/setup-bun

      - name: Read the application version
        id: version
        run: echo "version=$(node -p "require('./desktop/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build the Linux bundles (unsigned)
        run: bunx @tauri-apps/cli build --target x86_64-unknown-linux-gnu --bundles appimage,deb,rpm

      # Tauri names its bundles from productName, which carries a space and the
      # distribution's own arch spelling. Console links one name per format, so
      # each bundle is staged under the versioned name and aliased without it.
      - name: Stage the bundles under the published names
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p staging
          bundle=desktop/target/x86_64-unknown-linux-gnu/release/bundle
          for ext in AppImage deb rpm; do
            file="$(find "$bundle" -type f -name "*.$ext" | head -n 1)"
            test -n "$file" || { echo "No .$ext bundle was produced"; find "$bundle" -type f; exit 1; }
            cp "$file" "staging/redrob-design-x64-$APP_VERSION.$ext"
          done
          ls -la staging

      - name: Publish to cdn.redrob.ai
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/cdn-publish.sh staging
