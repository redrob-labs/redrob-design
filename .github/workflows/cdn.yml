# Publish the Redrob Design desktop downloads to https://cdn.redrob.ai/design/.
#
# This is not a product release: no npm, no GitHub Release, no store listing,
# just the files the Console product page links. Pushing this file is how the
# workflow runs, which is also how a publish is requested.
#
# All jobs publish from the same commit and the same version, so design/latest/
# holds one application rather than platform builds from different trees. The
# published keys are:
#
#   design/<version>/redrob-design-x64-<version>-setup.exe   signed, by version
#   design/<version>/redrob-design-{aarch64,x64}-<version>.dmg signed and notarized
#   design/latest/redrob-design-x64-setup.exe                the link that never moves
#   design/latest/redrob-design-{aarch64,x64}.dmg
#   design/latest/redrob-design-x64.{AppImage,deb,rpm}
#
# Windows NSIS is Authenticode-signed through Azure Artifact Signing with the
# organization's shared recipe (redrob-labs/.github actions/sign-windows): an
# OpenID Connect login, no certificate file, no client secret.
# The Linux bundles are UNSIGNED: an ubuntu runner has no Linux signing
# identity, and the download page must not imply otherwise.
#
# The upload is gated on the bucket and credentials being present, so an
# unprovisioned CDN cannot redden this build. The credentials carry
# s3:PutObject only, so a published key is verified with an HTTP GET through
# CloudFront and a checksum comparison, never with a listing or a read.
name: cdn

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cdn.yml'
      - '.github/scripts/cdn-publish.sh'

permissions:
  contents: read

jobs:
  windows:
    if: github.repository == 'redrob-labs/redrob-design'
    runs-on: windows-latest
    # `release` is the environment the organization's federated credential names; any other name
    # is refused by Azure.
    environment: release
    permissions:
      contents: read
      # The OIDC token `azure/login` exchanges for the Artifact Signing credential.
      id-token: write
    env:
      # Plain IDs (not credentials). The three ARTIFACT_SIGNING_* values are read by sign.ps1,
      # which tauri runs as its `signCommand` (see build.yml for the same recipe).
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_CERT_PROFILE: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}
      SIGN_DESCRIPTION: Redrob Design
      SIGN_URL: https://github.com/redrob-labs/redrob-design
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: redrob-labs/.github
          path: .redrob-shared

      - name: Require the Windows signing configuration
        shell: pwsh
        run: |
          foreach ($name in 'AZURE_CLIENT_ID', 'ARTIFACT_SIGNING_ENDPOINT', 'ARTIFACT_SIGNING_ACCOUNT', 'ARTIFACT_SIGNING_CERT_PROFILE') {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing $name secret (Azure Artifact Signing)" }
          }
          foreach ($name in 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID') {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing $name secret (Azure login)" }
          }
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: cdn-x86_64-pc-windows-msvc
          cache-on-failure: true

      - uses: ./.github/actions/setup-bun

      - name: Read the application version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./desktop/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      # tauri signs mid-bundling, so the shared signing script is handed to it as
      # `signCommand` through a config overlay: an absolute path into this runner's
      # checkout, hence not committed. tauri replaces `%1` with the file to sign.
      - name: Prepare the release build configuration
        id: config
        shell: pwsh
        run: |
          $sign = Join-Path $env:GITHUB_WORKSPACE ".redrob-shared/actions/sign-windows/sign.ps1"
          if (-not (Test-Path $sign)) { throw "shared signing script not found at $sign" }
          $overlay = Join-Path $env:RUNNER_TEMP "tauri.release.conf.json"
          @{
            build = @{
              beforeBuildCommand = "bun run generate:tauri-menu && bun run build:packages && bunx vite build"
            }
            bundle = @{
              windows = @{
                signCommand = @{
                  cmd  = "pwsh"
                  args = @("-NoProfile", "-File", $sign, "%1")
                }
              }
            }
          } | ConvertTo-Json -Depth 6 | Set-Content -Path $overlay -Encoding utf8
          "overlay=$overlay" >> $env:GITHUB_OUTPUT

      # Layered rather than committed, for the same reason as the other jobs: both
      # updater settings make `tauri build` demand the signing key, and a local build
      # must not need the release keypair. On Windows the update artefact is the NSIS
      # `-setup.exe` itself, signed in place as `<installer>.exe.sig`.
      - name: Prepare the updater configuration
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          bun scripts/tauri-updater-overlay.ts "$RUNNER_TEMP/tauri-updater.conf.json"
          if [ -f "$RUNNER_TEMP/tauri-updater.conf.json" ]; then
            echo "TAURI_UPDATER_CONFIG=$RUNNER_TEMP/tauri-updater.conf.json" >> "$GITHUB_ENV"
          fi

      # Compile first, without bundling: nothing is signed here, so no credential is needed yet.
      - name: Build the application
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx @tauri-apps/cli@2.11.4 build --target x86_64-pc-windows-msvc --no-bundle --config "${{ steps.config.outputs.overlay }}" ${TAURI_UPDATER_CONFIG:+--config "$TAURI_UPDATER_CONFIG"}

      # The login comes after the build on purpose: the OpenID Connect token is
      # short-lived and a long build left signtool without a usable credential.
      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bundle and sign the Windows installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx @tauri-apps/cli@2.11.4 build --target x86_64-pc-windows-msvc --bundles nsis --config "${{ steps.config.outputs.overlay }}" ${TAURI_UPDATER_CONFIG:+--config "$TAURI_UPDATER_CONFIG"}

      - name: Verify the Authenticode signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Recurse -Filter "*-setup.exe" -Path "desktop/target/x86_64-pc-windows-msvc/release/bundle" | Select-Object -First 1
          if (-not $installer) { throw "The NSIS installer was not produced" }
          # sign.ps1 already ran `signtool verify /pa` on it; this re-checks the one file that
          # leaves this job. A Public Trust certificate chains to a root the runner trusts, so
          # anything but Valid is a failure.
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") {
            throw "Authenticode signature is $($signature.Status) ($($signature.StatusMessage))"
          }
          $cn = $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($cn -ne "McKinley Rice, Inc.") { throw "Signed by CN=$cn, expected CN=McKinley Rice, Inc." }
          Write-Host "Signed by CN=$cn"
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item $installer.FullName "staging/redrob-design-x64-$($env:APP_VERSION)-setup.exe"
          # On Windows the update artefact IS the installer: with updater artefacts on,
          # tauri signs the NSIS setup.exe itself and writes `<installer>.exe.sig`
          # beside it -- there is no `-setup.nsis.zip`, which an earlier version of this
          # step looked for and never found. tauri-plugin-updater accepts either form:
          # it extracts the download when the bytes are a zip and otherwise runs them as
          # the installer (updater.rs `extract`), so pointing the feed at the installer
          # already being published is correct and adds no second artefact.
          #
          # The signature's absence is the normal no-updater build, not a failure.
          $sig = "$($installer.FullName).sig"
          if (Test-Path $sig) {
            $name = "redrob-design-x64-$($env:APP_VERSION)-setup.exe"
            Copy-Item $sig "staging/$name.sig"
            New-Item -ItemType Directory -Force -Path updater | Out-Null
            $signature = (Get-Content $sig -Raw).Trim()
            @{ platform = "windows-x86_64"; file = $name; signature = $signature } |
              ConvertTo-Json | Set-Content -Path "updater/windows-x86_64.updater.json" -Encoding utf8
          }
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Hand the updater fragment to the feed job
        if: hashFiles('updater/*.updater.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: updater-windows
          path: updater

      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows
          # Widened from the installer alone: the update archive and its signature
          # are staged here too and must reach the publish job, or the feed would
          # point at files the CDN never received.
          path: staging/redrob-design-x64-*
          if-no-files-found: error
          retention-days: 3

  # Publish from Ubuntu so the uploader sees a 403 as "not yet there" the same
  # way the Linux job does, and so a failed upload can be retried without a
  # 20-minute Windows rebuild.
  publish-windows:
    needs: windows
    if: github.repository == 'redrob-labs/redrob-design'
    runs-on: ubuntu-latest
    env:
      REDROB_CDN_BUCKET: ${{ vars.REDROB_CDN_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      CDN_PUBLIC_HOST: cdn.redrob.ai
      CDN_PREFIX: design
      APP_VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: signed-windows
          path: staging

      - name: Publish to cdn.redrob.ai
        run: bash .github/scripts/cdn-publish.sh staging


  macos:
    if: github.repository == 'redrob-labs/redrob-design'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - platform: macos-14
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.platform }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Require Apple signing and notarization secrets
        shell: bash
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_API_KEY_P8_BASE64 \
            APPLE_API_KEY \
            APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing macOS signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | openssl base64 -d -A > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: cdn-${{ matrix.target }}
          cache-on-failure: true

      - uses: ./.github/actions/setup-bun

      - name: Read the application version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./desktop/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Prepare the release build configuration
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"),p=require("node:path");fs.writeFileSync(p.join(process.env.RUNNER_TEMP,"tauri-cdn.conf.json"),JSON.stringify({build:{beforeBuildCommand:"bun run generate:tauri-menu && bun run build:packages && bunx vite build"}},null,2)+"\n")'
          echo "TAURI_CDN_CONFIG=$RUNNER_TEMP/tauri-cdn.conf.json" >> "$GITHUB_ENV"

      # Layered rather than committed, for the same reason as the Linux job: both
      # updater settings make `tauri build` demand the signing key. `app` joins the
      # bundle list because the macOS update artefact is the `.app.tar.gz` the app
      # bundle produces -- a dmg-only build emits no updater archive at all.
      - name: Prepare the updater configuration
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          bun scripts/tauri-updater-overlay.ts "$RUNNER_TEMP/tauri-updater.conf.json"
          if [ -f "$RUNNER_TEMP/tauri-updater.conf.json" ]; then
            echo "TAURI_UPDATER_CONFIG=$RUNNER_TEMP/tauri-updater.conf.json" >> "$GITHUB_ENV"
            echo "TAURI_BUNDLES=app,dmg" >> "$GITHUB_ENV"
          else
            echo "TAURI_BUNDLES=dmg" >> "$GITHUB_ENV"
          fi

      - name: Build the signed and notarized macOS DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx @tauri-apps/cli@2.11.4 build --target ${{ matrix.target }} --bundles "${TAURI_BUNDLES:-dmg}" --config "${{ env.TAURI_CDN_CONFIG }}" ${TAURI_UPDATER_CONFIG:+--config "$TAURI_UPDATER_CONFIG"}

      - name: Verify signing and notarization, then stage the DMG
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle="desktop/target/$TARGET/release/bundle"
          dmg="$(find "$bundle/dmg" -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          test -n "$dmg" || { echo 'The macOS DMG was not produced' >&2; exit 1; }
          codesign --verify --verbose=2 "$dmg"
          mount="$RUNNER_TEMP/redrob-design-$APP_ARCH"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          app="$(find "$mount" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$app" || { echo 'The signed app was not found inside the DMG' >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          hdiutil detach "$mount"
          trap - EXIT
          mkdir -p staging
          cp "$dmg" "staging/redrob-design-$APP_ARCH-$APP_VERSION.dmg"
          # The update artefact is the .app.tar.gz the app bundle wrote, signed only
          # when the signing key was configured; its absence is the normal
          # no-updater build rather than a failure. The tar carries the already
          # notarized .app, so nothing is re-signed here.
          archive="$(find "$bundle/macos" -maxdepth 1 -type f -name '*.app.tar.gz' | head -n 1 || true)"
          sig="${archive:+$archive.sig}"
          if [ -n "$archive" ] && [ -f "${sig:-}" ]; then
            cp "$archive" "staging/redrob-design-$APP_ARCH-$APP_VERSION.app.tar.gz"
            cp "$sig" "staging/redrob-design-$APP_ARCH-$APP_VERSION.app.tar.gz.sig"
            mkdir -p updater
            # The matrix arch is `aarch64` / `x64`, which is also what the published file
            # name carries. Mapped explicitly and made to FAIL on anything else: an
            # unrecognised value silently defaulting to darwin-x86_64 would label the
            # Apple-silicon build as Intel, and hand every arm64 Mac an archive it
            # cannot run.
            case "$APP_ARCH" in
            aarch64) PLATFORM=darwin-aarch64 ;;
            x64) PLATFORM=darwin-x86_64 ;;
            *)
              echo "Unknown macOS arch '$APP_ARCH'; refusing to guess an updater platform." >&2
              exit 1
              ;;
            esac
            export PLATFORM
            node -e 'const fs=require("node:fs");fs.writeFileSync(`updater/${process.env.PLATFORM}.updater.json`,JSON.stringify({platform:process.env.PLATFORM,file:`redrob-design-${process.env.APP_ARCH}-${process.env.APP_VERSION}.app.tar.gz`,signature:fs.readFileSync(process.argv[1],"utf8").trim()},null,2)+"\n")' "$sig"
          fi

      - name: Hand the updater fragment to the feed job
        if: hashFiles('updater/*.updater.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: updater-macos-${{ matrix.arch }}
          path: updater

      - uses: actions/upload-artifact@v4
        with:
          name: signed-macos-${{ matrix.arch }}
          # Widened from *.dmg: the update archive and its signature are staged here
          # too and must reach the publish job, or the feed would point at files the
          # CDN never received.
          path: staging/redrob-design-*
          if-no-files-found: error
          retention-days: 3

  # Both architecture builds must be signed and notarized before either macOS
  # alias moves, so latest/ cannot expose an incomplete macOS release.
  publish-macos:
    needs: macos
    if: github.repository == 'redrob-labs/redrob-design'
    runs-on: ubuntu-latest
    env:
      REDROB_CDN_BUCKET: ${{ vars.REDROB_CDN_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      CDN_PUBLIC_HOST: cdn.redrob.ai
      CDN_PREFIX: design

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: signed-macos-*
          path: staging
          merge-multiple: true

      - name: Read the application version
        id: version
        run: echo "version=$(node -p "require('./desktop/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish to cdn.redrob.ai
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/cdn-publish.sh staging

  linux:
    if: github.repository == 'redrob-labs/redrob-design'
    runs-on: ubuntu-22.04
    env:
      REDROB_CDN_BUCKET: ${{ vars.REDROB_CDN_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      CDN_PUBLIC_HOST: cdn.redrob.ai
      CDN_PREFIX: design

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: cdn-x86_64-unknown-linux-gnu
          cache-on-failure: true

      - name: Install the Linux bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: ./.github/actions/setup-bun

      - name: Read the application version
        id: version
        run: echo "version=$(node -p "require('./desktop/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Prepare the release build configuration
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"),p=require("node:path");fs.writeFileSync(p.join(process.env.RUNNER_TEMP,"tauri-cdn.conf.json"),JSON.stringify({build:{beforeBuildCommand:"bun run generate:tauri-menu && bun run build:packages && bunx vite build"}},null,2)+"\n")'
          echo "TAURI_CDN_CONFIG=$RUNNER_TEMP/tauri-cdn.conf.json" >> "$GITHUB_ENV"

      # Layered rather than committed: createUpdaterArtifacts and a plugins.updater
      # section both make `tauri build` demand the signing key, and a contributor's
      # local build must not need the release keypair. With no key configured this
      # writes nothing and the build behaves exactly as it did before.
      - name: Prepare the updater configuration
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          bun scripts/tauri-updater-overlay.ts "$RUNNER_TEMP/tauri-updater.conf.json"
          if [ -f "$RUNNER_TEMP/tauri-updater.conf.json" ]; then
            echo "TAURI_UPDATER_CONFIG=$RUNNER_TEMP/tauri-updater.conf.json" >> "$GITHUB_ENV"
          fi

      - name: Build the Linux bundles (unsigned)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx @tauri-apps/cli@2.11.4 build --target x86_64-unknown-linux-gnu --bundles appimage,deb,rpm --config "${{ env.TAURI_CDN_CONFIG }}" ${TAURI_UPDATER_CONFIG:+--config "$TAURI_UPDATER_CONFIG"}

      # Tauri names its bundles from productName, which carries a space and the
      # distribution's own arch spelling. Console links one name per format, so
      # each bundle is staged under the versioned name and aliased without it.
      - name: Stage the bundles under the published names
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p staging
          bundle=desktop/target/x86_64-unknown-linux-gnu/release/bundle
          for ext in AppImage deb rpm; do
            file="$(find "$bundle" -type f -name "*.$ext" | head -n 1)"
            test -n "$file" || { echo "No .$ext bundle was produced"; find "$bundle" -type f; exit 1; }
            cp "$file" "staging/redrob-design-x64-$APP_VERSION.$ext"
          done
          # The AppImage is also the Linux update artefact. Its signature is written
          # beside it only when the signing key was configured, so its absence is the
          # normal no-updater build rather than a failure.
          sig="$(find "$bundle" -type f -name "*.AppImage.sig" | head -n 1)"
          if [ -n "$sig" ]; then
            cp "$sig" "staging/redrob-design-x64-$APP_VERSION.AppImage.sig"
            mkdir -p updater
            node -e 'const fs=require("node:fs");fs.writeFileSync("updater/linux-x86_64.updater.json",JSON.stringify({platform:"linux-x86_64",file:`redrob-design-x64-${process.env.APP_VERSION}.AppImage`,signature:fs.readFileSync(process.argv[1],"utf8").trim()},null,2)+"\n")' "$sig"
          fi
          ls -la staging

      - name: Publish to cdn.redrob.ai
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/cdn-publish.sh staging

      - name: Hand the updater fragment to the feed job
        if: hashFiles('updater/*.updater.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: updater-linux
          path: updater


  # The updater plugin reads ONE document and picks its own platform out of it, so
  # the feed can only be written once every platform has reported. A platform that
  # produced no signature contributes no fragment and is simply absent from the
  # feed: an entry the app cannot verify is worse than no update for that platform.
  #
  # Depends on the PUBLISH jobs, not the build jobs, and deliberately does not run
  # with always(): a feed is a promise that those bytes are retrievable, so it must
  # not be written while an upload is still in flight or has failed.
  #
  # With no signing key configured no job produces a fragment, this job finds
  # nothing, and it says so and exits green -- which is exactly how every release
  # before this one behaved.
  publish-updater-feed:
    needs: [publish-windows, publish-macos, linux]
    if: github.repository == 'redrob-labs/redrob-design'
    runs-on: ubuntu-latest
    env:
      REDROB_CDN_BUCKET: ${{ vars.REDROB_CDN_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      CDN_PUBLIC_HOST: cdn.redrob.ai
      CDN_PREFIX: design
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-bun

      - name: Read the application version
        id: version
        run: echo "version=$(node -p "require('./desktop/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: fragments
          merge-multiple: true
        continue-on-error: true

      - name: Build and publish the update feed
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! ls fragments/*.updater.json >/dev/null 2>&1; then
            echo "::notice::No signed update artefacts were produced, so no feed was published."
            exit 0
          fi
          mkdir -p feed
          # The VERSION directory, not latest/. cdn-publish.sh deliberately drops the
          # "-<version>" segment when it moves the latest/ alias, so a versioned name
          # under latest/ is a 403 -- measured. The versioned directory is also the
          # right thing for an updater feed on its own terms: a feed for 0.14.0 must
          # keep pointing at 0.14.0's bytes after the alias has moved on.
          bun scripts/build-updater-feed.ts fragments "$APP_VERSION" \
            "https://$CDN_PUBLIC_HOST/$CDN_PREFIX/$APP_VERSION" feed/latest.json
          cat feed/latest.json
          if [ -z "${REDROB_CDN_BUCKET:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "::notice::CDN credentials are not configured, so the feed was built but not uploaded."
            exit 0
          fi
          aws s3 cp feed/latest.json "s3://$REDROB_CDN_BUCKET/$CDN_PREFIX/$APP_VERSION/latest.json" \
            --content-type application/json --cache-control "public, max-age=60"
          aws s3 cp feed/latest.json "s3://$REDROB_CDN_BUCKET/$CDN_PREFIX/latest/latest.json" \
            --content-type application/json --cache-control "public, max-age=60"
