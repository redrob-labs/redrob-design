# Build the desktop app for every platform on a `v*` tag and publish the GitHub Release
# Redrob Launcher installs from.
#
# The launcher reads an asset only when its name is `redrob-design-<version>-<os>-<arch>.<ext>`
# (tools/release-assets/src/asset-names.ts spells the rule and mirrors the launcher's parser).
# Tauri names its bundles from productName, so each platform job stages its bundles under the
# launcher's names and hands them to one `release` job, which checks every name, creates the
# release as a draft, uploads the assets one at a time with retries, and only then publishes
# it. One job per platform rather than tauri-action's per-job upload, because a release
# assembled by five jobs racing to the same draft is how 0.15.0 ended up as a macOS-only draft.
#
# Self-update does not read this release: the updater endpoint is the CDN feed that
# .github/workflows/cdn.yml publishes (see tools/updater/src/config-overlay.ts), so the names
# here are free to be the launcher's. The updater overlay is still layered on so that an app
# installed from here checks that feed.
#
# Published asset names:
#   redrob-design-<version>-macos-aarch64.dmg          signed and notarized
#   redrob-design-<version>-macos-x86_64.dmg           signed and notarized
#   redrob-design-<version>-windows-x64.msi            Authenticode-signed
#   redrob-design-<version>-windows-x64-setup.exe      Authenticode-signed (not launcher-installable)
#   redrob-design-<version>-linux-x86_64.{AppImage,deb,rpm}   unsigned
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  TAURI_CLI_VERSION: 2.11.4

jobs:
  windows:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WIN_CSC_LINK }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Require the Windows signing certificate
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { throw "Missing WIN_CSC_LINK organization secret" }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "Missing WIN_CSC_KEY_PASSWORD organization secret" }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: release-x86_64-pc-windows-msvc
          cache-on-failure: true

      - uses: ./.github/actions/setup-bun

      - name: Read the application version
        id: version
        shell: bash
        run: bash .github/scripts/release-version.sh >> "$GITHUB_OUTPUT"

      # `tauri build` signs from the certificate store by thumbprint, handed over as a config
      # overlay because a thumbprint is specific to this runner's store.
      - name: Import the signing certificate
        id: certificate
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "redrob-code-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          if (-not $imported.Thumbprint) { throw "The certificate imported without a thumbprint" }
          Write-Host "Imported $($imported.Subject)"
          $overlay = Join-Path $env:RUNNER_TEMP "tauri.sign.conf.json"
          @{
            build = @{
              beforeBuildCommand = "bun run generate:tauri-menu && bun run build:packages && bunx vite build"
            }
            bundle = @{
              windows = @{
                certificateThumbprint = $imported.Thumbprint
                digestAlgorithm       = "sha256"
                timestampUrl          = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Path $overlay -Encoding utf8
          "overlay=$overlay" >> $env:GITHUB_OUTPUT

      - name: Prepare the updater configuration
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          bun scripts/tauri-updater-overlay.ts "$RUNNER_TEMP/tauri-updater.conf.json"
          if [ -f "$RUNNER_TEMP/tauri-updater.conf.json" ]; then
            echo "TAURI_UPDATER_CONFIG=$RUNNER_TEMP/tauri-updater.conf.json" >> "$GITHUB_ENV"
          fi

      # msi is what the launcher installs; the NSIS setup.exe stays for people downloading by hand.
      - name: Build the signed Windows installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx @tauri-apps/cli@$TAURI_CLI_VERSION build --target x86_64-pc-windows-msvc --bundles msi,nsis --config "${{ steps.certificate.outputs.overlay }}" ${TAURI_UPDATER_CONFIG:+--config "$TAURI_UPDATER_CONFIG"}

      - name: Verify the Authenticode signatures
        shell: pwsh
        run: |
          $bundle = "desktop/target/x86_64-pc-windows-msvc/release/bundle"
          $files = @(Get-ChildItem -Recurse -Path $bundle -Include "*.msi", "*-setup.exe" -File)
          if ($files.Count -lt 2) { throw "Expected an msi and a setup.exe under $bundle, found $($files.Count) file(s)" }
          $accepted = @("Valid", "UnknownError", "NotTrusted")
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if (-not $signature.SignerCertificate) { throw "$($file.Name) has no Authenticode signer certificate" }
            if ($accepted -notcontains $signature.Status.ToString()) {
              throw "$($file.Name): invalid Authenticode signature: $($signature.Status) ($($signature.StatusMessage))"
            }
            Write-Host "$($file.Name) signed by: $($signature.SignerCertificate.Subject) status=$($signature.Status)"
          }

      - name: Stage the bundles under the launcher's names
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p staging
          bundle=desktop/target/x86_64-pc-windows-msvc/release/bundle
          msi="$(find "$bundle/msi" -maxdepth 1 -type f -name '*.msi' | head -n 1)"
          test -n "$msi" || { echo 'No .msi bundle was produced' >&2; find "$bundle" -type f; exit 1; }
          cp "$msi" "staging/redrob-design-$APP_VERSION-windows-x64.msi"
          exe="$(find "$bundle/nsis" -maxdepth 1 -type f -name '*-setup.exe' | head -n 1)"
          test -n "$exe" || { echo 'No NSIS setup.exe was produced' >&2; find "$bundle" -type f; exit 1; }
          cp "$exe" "staging/redrob-design-$APP_VERSION-windows-x64-setup.exe"
          ls -la staging

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: staging/redrob-design-*
          if-no-files-found: error
          retention-days: 3

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - platform: macos-14
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.platform }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Require Apple signing and notarization secrets
        shell: bash
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_API_KEY_P8_BASE64 \
            APPLE_API_KEY \
            APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing macOS signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | openssl base64 -d -A > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: release-${{ matrix.target }}
          cache-on-failure: true

      - uses: ./.github/actions/setup-bun

      - name: Read the application version
        id: version
        shell: bash
        run: bash .github/scripts/release-version.sh >> "$GITHUB_OUTPUT"

      - name: Prepare the release build configuration
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"),p=require("node:path");fs.writeFileSync(p.join(process.env.RUNNER_TEMP,"tauri-release.conf.json"),JSON.stringify({build:{beforeBuildCommand:"bun run generate:tauri-menu && bun run build:packages && bunx vite build"}},null,2)+"\n")'
          echo "TAURI_RELEASE_CONFIG=$RUNNER_TEMP/tauri-release.conf.json" >> "$GITHUB_ENV"

      - name: Prepare the updater configuration
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          bun scripts/tauri-updater-overlay.ts "$RUNNER_TEMP/tauri-updater.conf.json"
          if [ -f "$RUNNER_TEMP/tauri-updater.conf.json" ]; then
            echo "TAURI_UPDATER_CONFIG=$RUNNER_TEMP/tauri-updater.conf.json" >> "$GITHUB_ENV"
          fi

      - name: Build the signed and notarized macOS DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx @tauri-apps/cli@$TAURI_CLI_VERSION build --target ${{ matrix.target }} --bundles dmg --config "${{ env.TAURI_RELEASE_CONFIG }}" ${TAURI_UPDATER_CONFIG:+--config "$TAURI_UPDATER_CONFIG"}

      - name: Verify signing and notarization, then stage the DMG
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle="desktop/target/$TARGET/release/bundle"
          dmg="$(find "$bundle/dmg" -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          test -n "$dmg" || { echo 'The macOS DMG was not produced' >&2; exit 1; }
          codesign --verify --verbose=2 "$dmg"
          mount="$RUNNER_TEMP/redrob-design-$APP_ARCH"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          app="$(find "$mount" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$app" || { echo 'The signed app was not found inside the DMG' >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          hdiutil detach "$mount"
          trap - EXIT
          mkdir -p staging
          cp "$dmg" "staging/redrob-design-$APP_VERSION-macos-$APP_ARCH.dmg"
          ls -la staging

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: staging/redrob-design-*
          if-no-files-found: error
          retention-days: 3

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: release-x86_64-unknown-linux-gnu
          cache-on-failure: true

      - name: Install the Linux bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: ./.github/actions/setup-bun

      - name: Read the application version
        id: version
        run: bash .github/scripts/release-version.sh >> "$GITHUB_OUTPUT"

      - name: Prepare the release build configuration
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"),p=require("node:path");fs.writeFileSync(p.join(process.env.RUNNER_TEMP,"tauri-release.conf.json"),JSON.stringify({build:{beforeBuildCommand:"bun run generate:tauri-menu && bun run build:packages && bunx vite build"}},null,2)+"\n")'
          echo "TAURI_RELEASE_CONFIG=$RUNNER_TEMP/tauri-release.conf.json" >> "$GITHUB_ENV"

      - name: Prepare the updater configuration
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          bun scripts/tauri-updater-overlay.ts "$RUNNER_TEMP/tauri-updater.conf.json"
          if [ -f "$RUNNER_TEMP/tauri-updater.conf.json" ]; then
            echo "TAURI_UPDATER_CONFIG=$RUNNER_TEMP/tauri-updater.conf.json" >> "$GITHUB_ENV"
          fi

      # Unsigned: an ubuntu runner has no Linux signing identity.
      - name: Build the Linux bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx @tauri-apps/cli@$TAURI_CLI_VERSION build --target x86_64-unknown-linux-gnu --bundles appimage,deb,rpm --config "${{ env.TAURI_RELEASE_CONFIG }}" ${TAURI_UPDATER_CONFIG:+--config "$TAURI_UPDATER_CONFIG"}

      - name: Stage the bundles under the launcher's names
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p staging
          bundle=desktop/target/x86_64-unknown-linux-gnu/release/bundle
          for ext in AppImage deb rpm; do
            file="$(find "$bundle" -type f -name "*.$ext" | head -n 1)"
            test -n "$file" || { echo "No .$ext bundle was produced"; find "$bundle" -type f; exit 1; }
            cp "$file" "staging/redrob-design-$APP_VERSION-linux-x86_64.$ext"
          done
          ls -la staging

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: staging/redrob-design-*
          if-no-files-found: error
          retention-days: 3

  # One job assembles the release, after every platform has built: check every name against what
  # the launcher reads, create the release as a draft, upload the assets one by one (a single
  # multi-asset upload rolls the whole release back on one transient 5xx), compare the uploaded
  # count against the staged count, and only then take it out of draft.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-bun

      - name: Read the application version
        id: version
        run: bash .github/scripts/release-version.sh >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      # One more asset beside the installers: the manifest Redrob Launcher reads to learn, without a
      # launcher change, that this release uses the launcher sign-in (shared account). The check that
      # follows refuses a staging directory without it, and publish-release.sh uploads it with the rest.
      - name: Write the launcher release manifest
        run: bun scripts/write-launcher-manifest.ts assets

      - name: Check every asset name against what Redrob Launcher reads
        run: |
          bun scripts/check-release-assets.ts assets "${{ steps.version.outputs.version }}" \
            --require macos-aarch64:dmg \
            --require macos-x86_64:dmg \
            --require windows-x64:msi \
            --require linux-x86_64:AppImage,deb,rpm

      - name: Extract release notes
        run: bun tools/release-packages/src/extract-release-notes.ts "${{ steps.version.outputs.version }}" "$RUNNER_TEMP/release-notes.md"

      - name: Publish the release
        env:
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/publish-release.sh "$TAG" assets "$RUNNER_TEMP/release-notes.md"
