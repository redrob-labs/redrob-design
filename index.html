<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Redrob Design System 2026 product icon. favicon.svg switches to the dark tile itself. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f9fb" />
    <title>Redrob Design</title>
    <script id="theme-boot">
      // Mirrors resolveAppTheme() in src/app/shell/theme.ts so the splash paints in the saved theme
      // before the app bundle loads. Light is the default for installs with no saved choice.
      try {
        var stored = localStorage.getItem('redrob-design:theme')
        var setting = stored === 'dark' || stored === 'light' || stored === 'auto' ? stored : 'light'
        var resolved =
          setting === 'auto'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : setting
        document.documentElement.dataset.theme = resolved
        document.documentElement.style.colorScheme = resolved
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <style>
      /* Ground before app.css loads: Redrob DS surface-raised per theme. */
      :root,
      html[data-theme='light'] {
        --loader-bg: #f8f9fb;
      }
      html[data-theme='dark'] {
        --loader-bg: #141719;
      }
      body { margin: 0; background: var(--loader-bg); }
    </style>
    <link rel="stylesheet" href="/splash/redrob-splash.css" />
  </head>

  <body>
    <div id="app"></div>
    <!-- Launch splash (Redrob Design System 2026): the Redrob lockup, then the Design icon
         and "Redrob Design". Once per session; it waits for "redrob:app-ready" from main.ts. -->
    <script src="/splash/redrob-splash.iife.js"></script>
    <script>
      ;(function () {
        if (!window.showRedrobSplash) return
        var ready = new Promise(function (resolve) {
          if (window.__redrobAppReady) return resolve()
          window.addEventListener('redrob:app-ready', resolve, { once: true })
        })
        window.showRedrobSplash({
          logoLight: '/splash/redrob-logo-primary.png',
          logoDark: '/splash/redrob-logo-primary-white.png',
          ready: ready
        })
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
